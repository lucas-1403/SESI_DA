<!DOCTYPE html>
<html lang="PT-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora 🧮</title>
    <link rel="stylesheet" href="./calculadora.css">
</head>

<body>
    <input id="campo" type="text" disabled="true">
    <button onclick="digitar('limpar')">LIMPAR</button>
    <br>
    <button onclick="digitar(7)" class="botao">7</button>
    <button onclick="digitar(8)" class="botao">8</button>
    <button onclick="digitar(9)" class="botao">9</button>
    <button onclick="digitar('/')" class="operador">/</button>
    <br>
    <button onclick="digitar(4)" class="botao">4</button>
    <button onclick="digitar(5)" class="botao">5</button>
    <button onclick="digitar(6)" class="botao">6</button>
    <button onclick="digitar('*')" class="operador">*</button>
    <br>
    <button onclick="digitar(1)" class="botao">1</button>
    <button onclick="digitar(2)" class="botao">2</button>
    <button onclick="digitar(3)" class="botao">3</button>
    <button onclick="digitar('-')" class="operador">-</button>
    <br>
    <button onclick="digitar('=')" style="width: 75px;" class="resultado">=</button>
    <button onclick="digitar('+')" class="operador">+</button>

    <script src="./calculadora.js"></script>
</body>

</html>
